<style>
html{color-scheme:only light}
body{margin:0;font-family:sans-serif;background:#fff}
#map{height:100vh;width:100%}
#login{position:fixed;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000}
#login input{padding:12px;width:240px;border-radius:8px;border:none;font-size:16px}
#login button{padding:12px 24px;border-radius:8px;border:none;background:#1a73e8;color:#fff;font-size:16px}
#stats{position:fixed;top:10px;right:10px;z-index:900;background:rgba(255,255,255,.94);padding:8px 26px 8px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:13px;line-height:1.5;display:none;max-width:72%;backface-visibility:hidden}
#logout{position:fixed;top:10px;left:10px;z-index:1000;width:40px;height:40px;border:none;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:18px;cursor:pointer;display:none}
#cur{position:fixed;bottom:96px;left:10px;z-index:900;background:rgba(255,255,255,.95);padding:7px 12px;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.35);display:none;text-align:center;min-width:92px}
#cur .u{font-size:11px;color:#666}
#cur .v{font-size:23px;font-weight:bold;line-height:1.15}
#cur .g{font-size:13px;font-weight:bold;margin-top:1px}
#legend{position:fixed;bottom:64px;left:10px;z-index:900;background:rgba(255,255,255,.92);padding:4px 9px;border-radius:6px;font-size:11px;display:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#legend b{font-size:14px;vertical-align:-1px}

#bar #selbtn{width:100%;padding:10px;border-radius:8px;border:none;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.3);background:#fff;font-weight:normal;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar #sellist{display:none;position:absolute;bottom:48px;left:0;right:0;max-height:50vh;overflow-y:auto;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#bar #sellist .dditem{padding:13px 14px;font-size:15px;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar #sellist .ddday{padding:8px 14px;font-size:13px;font-weight:bold;color:#fff;background:#1a73e8;position:sticky;top:0}
#bar #sellist .dditem:active{background:#e8f0fe}
#bar button{padding:10px 13px;border-radius:8px;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-weight:bold}

<body>
<div id="login">
<h2>🚗 주행기록</h2>
<input id="email" type="email" placeholder="이메일">
<input id="pw" type="password" placeholder="비밀번호">
<button onclick="login()">로그인</button>
<div id="msg"></div>
</div>
<div id="stats"></div>
<button id="logout" onclick="logout()" title="로그아웃">🚪</button>
<div id="cur"></div>
<div id="legend">느림 <b style="color:#e53935">●</b><b style="color:#fb8c00">●</b><b style="color:#fbc02d">●</b><b style="color:#7cb342">●</b><b style="color:#2e7d32">●</b> 빠름</div>
<div id="bar">
<button id="dbtn" onclick="openDate()" title="날짜 필터">📅</button>
<input id="dfilter" type="date" onchange="onDateChange()">
<div id="seldd"><button id="selbtn" onclick="toggleDD()">주행 선택 ▾</button><div id="sellist"></div></div>

<button id="rfbtn" onclick="refresh()">↻</button>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://rzdjebtjlejjskvjrdec.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6ZGplYnRqbGVqanNrdmpyZGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTA0NDUsImV4cCI6MjA5Njk4NjQ0NX0.Gsd-dNi0nXVKXPu4Ch3etZrc0Kf-WDaJA6bjlKVxdo4";
const MERGE_GAP_MIN=2;
const MI2KM=1.60934;
const KWH_TOTAL=62;     // Model Y 프리미엄 RWD (62.1kWh)
let WON_PER_KWH=+localStorage.getItem('won_per_kwh')||314;  // 집 충전 단가(⚡버튼으로 수정)
let WON_EXT=+localStorage.getItem('won_per_kwh_ext')||339;  // 외부(급속) 충전 단가
const API_LIMIT=4000;   // 이번 달 API 안전 한도 (무료 ~$10 ≈ 5000콜, 버퍼 두고 4000). 조정 가능
const sb=supabase.createClient(SB_URL,SB_KEY);
let map,layer,trips=[],curKey=null,live=false,liveTimer=null,geocache={},monthStr='',curData=[],replayMarker=null,replayTimer=null,replayRaf=null,arrowDeco=null,arrowTimer=null,arrowOffset=0;
let statsFlipped=false,frontHTML='',chargeRows=null,seasonRows=null;
function kmh(mph){return (mph==null)?null:Math.round(mph*MI2KM);}
function editRate(){
  const v=prompt('집 충전 단가 (원/kWh)\n실제 충전 요금으로 바꾸세요.',WON_PER_KWH);
  if(v===null)return;
  const n=parseFloat(v);
  if(!isFinite(n)||n<=0){alert('숫자를 입력하세요');return;}
  WON_PER_KWH=n;
  localStorage.setItem('won_per_kwh',String(n));
  if(statsFlipped)paintCharge();else if(curKey)selectTrip(curKey);
  alert('집 단가 '+n+'원/kWh 적용됐어요');
}
function editRateExt(){
  const v=prompt('외부(급속) 충전 단가 (원/kWh)',WON_EXT);
  if(v===null)return;
  const n=parseFloat(v);
  if(!isFinite(n)||n<=0){alert('숫자를 입력하세요');return;}
  WON_EXT=n;
  localStorage.setItem('won_per_kwh_ext',String(n));
  if(statsFlipped)paintCharge();
  alert('외부 단가 '+n+'원/kWh 적용됐어요');
}
function flipBtn(){return '<div onclick="flipStats()" style="position:absolute;top:5px;right:7px;font-size:16px;line-height:1;color:#16a34a;cursor:pointer;z-index:3">⟲</div>';}
function setFront(html){frontHTML=html;if(!statsFlipped)document.getElementById('stats').innerHTML=flipBtn()+html;}
function flipStats(){
  const el=document.getElementById('stats');
  if(el._flip)return;el._flip=true;
  el.style.transformOrigin='center';
  el.style.transition='transform .2s ease-in';
  el.style.transform='perspective(700px) rotateY(90deg)';
  setTimeout(()=>{
    statsFlipped=!statsFlipped;
    if(statsFlipped)paintCharge(true);else el.innerHTML=flipBtn()+frontHTML;
    el.style.transition='transform .2s ease-out';
    el.style.transform='perspective(700px) rotateY(0deg)';
    setTimeout(()=>{el._flip=false;},210);
  },200);
}
function paintCharge(reload){
  const el=document.getElementById('stats');
  if(reload){
    el.innerHTML=flipBtn()+'<div style="color:#16a34a;font-weight:bold">🔌 충전</div><div style="font-size:12px;color:#5f6368;margin-top:3px">불러오는 중…</div>';
    Promise.all([
      sb.from('charge_events').select('park_end,delta_pct,kwh,is_home').order('park_end',{ascending:false}).limit(200),
      sb.from('season_efficiency').select('*')
    ]).then(([c,s])=>{
      chargeRows=c.error?('ERR:'+c.error.message):(c.data||[]);
      seasonRows=s.error?null:(s.data||[]);
      if(statsFlipped)el.innerHTML=flipBtn()+chargeHTML();
    });
    return;
  }
  el.innerHTML=flipBtn()+chargeHTML();
}
function rateLine(){
  return '<div style="margin-top:6px;font-size:12px;color:#5f6368">⚡ <span onclick="editRate()" style="text-decoration:underline">집 '+WON_PER_KWH+'원</span> · <span onclick="editRateExt()" style="text-decoration:underline">외부 '+WON_EXT+'원</span> 변경 ›</div>';
}
function seasonHTML(){
  const lab={winter:'겨울 &lt;5℃',spring_fall:'봄·가을 5–20℃',summer:'여름 &gt;20℃'};
  const order=['winter','spring_fall','summer'];
  const byS={};(seasonRows||[]).forEach(r=>{byS[r.season]=r;});
  let rows='';
  order.forEach(s=>{
    const r=byS[s];
    const val=r?(r.wh_per_km+' <span style="color:#9aa0a6;font-weight:normal">('+r.drives+')</span>'):'<span style="color:#9aa0a6">—</span>';
    rows+='<tr><td style="padding:1px 8px 1px 0;white-space:nowrap">'+lab[s]+'</td><td style="text-align:right;font-weight:bold">'+val+'</td></tr>';
  });
  return '<div style="margin-top:7px;border-top:1px solid #e3e3e3;padding-top:5px"><div style="color:#16a34a;font-weight:bold;font-size:12px;margin-bottom:2px">🌡️ 계절 전비 (Wh/km · 낮을수록 좋음)</div><table style="font-size:12px;border-collapse:collapse">'+rows+'</table></div>';
}
function chargeHTML(){
  if(typeof chargeRows==='string'&&chargeRows.slice(0,4)==='ERR:'){
    return '<div style="color:#16a34a;font-weight:bold;margin-bottom:2px">🔌 충전</div><div style="font-size:12px;color:#d93025">읽기 실패 — charge_events 권한 필요</div>'+seasonHTML()+rateLine();
  }
  const rows=chargeRows||[];
  const ym=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).slice(0,7);
  let kH=0,kE=0,cH=0,cE=0;
  rows.forEach(r=>{
    const m=new Date(r.park_end).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).slice(0,7);
    if(m!==ym)return;
    if(r.is_home){kH+=(+r.kwh||0);cH++;}else{kE+=(+r.kwh||0);cE++;}
  });
  const won=Math.round(kH*WON_PER_KWH+kE*WON_EXT);
  let html='<div style="color:#16a34a;font-weight:bold;margin-bottom:2px">🔌 이번 달 충전</div>';
  html+='⚡ '+(kH+kE).toFixed(1)+'kWh · '+won.toLocaleString()+'원';
  html+='<br>🔁 '+(cH+cE)+'회 (집 '+cH+' · 외부 '+cE+')';
  const last=rows[0];
  if(last){
    const d=new Date(last.park_end).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    html+='<br><span style="color:#5f6368;font-size:12px">최근 '+d+' · +'+last.delta_pct+'% · '+(+last.kwh).toFixed(1)+'kWh · '+(last.is_home?'집':'외부')+'</span>';
  }else{
    html+='<br><span style="color:#5f6368;font-size:12px">이번 달 충전 기록 없음</span>';
  }
  return html+seasonHTML()+rateLine();
}
function speedColor(v){
  if(v==null)return '#1a73e8';
  if(v<20)return '#e53935';
  if(v<40)return '#fb8c00';
  if(v<60)return '#fbc02d';
  if(v<80)return '#7cb342';
  return '#2e7d32';
}
function gearColor(g){return g==='D'?'#2e7d32':(g==='R'?'#e65100':(g==='P'?'#555':'#1a73e8'));}
function stopReplay(){
  if(replayTimer){clearInterval(replayTimer);replayTimer=null;}
  if(replayRaf){cancelAnimationFrame(replayRaf);replayRaf=null;}
  if(replayMarker){map.removeLayer(replayMarker);replayMarker=null;}
}
function stopArrows(){if(arrowTimer){clearInterval(arrowTimer);arrowTimer=null;}}
function startArrows(){if(!arrowDeco||arrowTimer||document.hidden)return;arrowTimer=setInterval(()=>{arrowOffset=(arrowOffset+3)%85;arrowDeco.setPatterns([{offset:arrowOffset,repeat:85,symbol:arrowSym()}]);},70);}
function arrowSym(){return L.Symbol.arrowHead({pixelSize:11,polygon:true,pathOptions:{fill:true,fillColor:'#e82127',fillOpacity:1,color:'#e82127',weight:1}});}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopArrows();else startArrows();});
function playRoute(){
  stopReplay();
  const pts=(curData||[]).filter(p=>p.lat&&p.lng);
  if(pts.length<2)return;
  const curEl=document.getElementById('cur');
  const total=pts.length;
  const durMs=Math.max(4000,Math.min(14000,total*350));
  replayMarker=L.circleMarker([pts[0].lat,pts[0].lng],{radius:8,color:'#fff',weight:2,fillColor:'#9333ea',fillOpacity:1}).addTo(map);
  const t0=Date.now();
  replayTimer=setInterval(()=>{
    if(!replayMarker){clearInterval(replayTimer);replayTimer=null;return;}
    const prog=Math.min(1,Math.max(0,(Date.now()-t0)/durMs));
    const fpos=prog*(total-1);
    const i=Math.floor(fpos),f=fpos-i;
    const a=pts[i],b=pts[Math.min(total-1,i+1)];
    replayMarker.setLatLng([a.lat+(b.lat-a.lat)*f,a.lng+(b.lng-a.lng)*f]);
    const v=kmh(a.speed),g=a.shift_state||'-';
    curEl.style.display='block';
    curEl.innerHTML='<div class="u">▶ 재생</div><div class="v">'+(v!=null?v:0)+' <span class="u">km/h</span></div><div class="g" style="color:'+gearColor(g)+'">'+g+'</div>';
    if(prog>=1){
      clearInterval(replayTimer);replayTimer=null;
      if(replayMarker){map.removeLayer(replayMarker);replayMarker=null;}
      const lp=pts[total-1],lv=kmh(lp.speed),lg=lp.shift_state||'-';
      curEl.innerHTML='<div class="u">'+(live?'🔴 현재':'🏁 마지막')+'</div><div class="v">'+(lv!=null?lv:0)+' <span class="u">km/h</span></div><div class="g" style="color:'+gearColor(lg)+'">'+lg+'</div>';
    }
  },33);
}
function openDate(){
  const f=document.getElementById('dfilter');
  if(f.value){f.value='';updateDateBtn();loadList(false);return;}
  try{f.showPicker();}catch(e){try{f.focus();f.click();}catch(_){}}
}
function onDateChange(){updateDateBtn();loadList(false);}
function updateDateBtn(){
  const f=document.getElementById('dfilter');
  const b=document.getElementById('dbtn');
  if(f.value){b.style.background='#1a73e8';b.style.color='#fff';}
  else{b.style.background='#fff';b.style.color='#000';}
}
async function login(){
  const email=document.getElementById('email').value;
  const pw=document.getElementById('pw').value;
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){document.getElementById('msg').innerText="로그인 실패: "+error.message;return;}
  start();
}
function start(){
  document.getElementById('login').style.display='none';
  document.getElementById('bar').style.display='flex';
  document.getElementById('stats').style.display='block';
  document.getElementById('legend').style.display='block';
  document.getElementById('logout').style.display='block';
  if(!map){map=L.map('map',{zoomControl:false}).setView([37.32,127.1],12);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap, HOT'}).addTo(map);}
  loadList(false);
}
async function logout(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
}
function toggleLive(){
  live=!live;
  const b=document.getElementById('live');
  if(live){document.getElementById('dfilter').value='';updateDateBtn();b.style.background='#e82127';b.style.color='#fff';b.textContent='● LIVE';loadList(false);liveTimer=setInterval(()=>loadList(false),5000);}
  else{b.style.background='#fff';b.style.color='#000';b.textContent='LIVE';clearInterval(liveTimer);}
}
function label(t){
  const w=new Date(t.start);
  const s=w.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  const tag=(t.key&&t.key.indexOf('drive-')===0)?'':' (테스트)';
  const merged=t.segs>1?(' · '+t.segs+'구간'):'';
  return s+tag+' · '+t.points+'개'+merged;
}
function rowLabel(t){
  const tm=new Date(t.start).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false});
  const tag=(t.key&&t.key.indexOf('drive-')===0)?'':' (테스트)';
  const merged=t.segs>1?(' · '+t.segs+'구간'):'';
  return tm+tag+' · '+t.points+'개'+merged;
}
function dayHeader(start){
  const d=new Date(start);
  return d.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric'})+' ('+d.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',weekday:'short'})+')';
}
function dist(a,b){
  const R=6371,r=x=>x*Math.PI/180;
  const dLat=r(b[0]-a[0]),dLng=r(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
async function placeName(lat,lng){
  const key=lat.toFixed(4)+','+lng.toFixed(4);
  if(geocache[key])return geocache[key];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&accept-language=ko&lat='+lat+'&lon='+lng);
    const j=await r.json();const a=j.address||{};
    const n=a.suburb||a.neighbourhood||a.quarter||a.borough||a.city_district||a.town||a.village||a.road||a.city||'?';
    geocache[key]=n;return n;
  }catch(e){return '?';}
}
function toggleDD(){const l=document.getElementById('sellist');l.style.display=(l.style.display==='block')?'none':'block';}
function closeDD(){const l=document.getElementById('sellist');if(l)l.style.display='none';}
function setSel(key){const t=trips.find(x=>x.key===key);document.getElementById('selbtn').textContent=(t?label(t):'주행 선택')+' ▾';}
function pickTrip(key){setSel(key);closeDD();selectTrip(key);}
document.addEventListener('click',e=>{const dd=document.getElementById('seldd');if(dd&&!dd.contains(e.target))closeDD();});
function refresh(){
  if(live){
    sb.from('control').update({poll_now:new Date().toISOString()}).eq('id',1).then(()=>{},()=>{});
    const b=document.getElementById('rfbtn');
    if(b){const o=b.textContent;b.textContent='🔄';b.style.background='#1a73e8';b.style.color='#fff';setTimeout(()=>{b.textContent=o;b.style.background='#fff';b.style.color='#000';},1200);}
  }
  loadList(true);
}
async function loadList(keepSel){
  const {data,error}=await sb.from('drive_list').select('*').order('end_ts',{ascending:false}).limit(500);
  if(error){if(!live)alert('목록 읽기 실패: '+error.message);return;}
  let segs=(data||[]).map(d=>({id:d.drive_id,start:new Date(d.start_ts).getTime(),end:new Date(d.end_ts).getTime(),points:d.points,odoMin:d.odo_min,odoMax:d.odo_max}));
  segs.sort((a,b)=>a.start-b.start);
  const GAP=MERGE_GAP_MIN*60000;trips=[];
  segs.forEach(s=>{const last=trips[trips.length-1];
    if(last&&(s.start-last.end)<=GAP){
      last.ids.push(s.id);last.end=s.end;last.points+=s.points;last.segs++;
      if(s.odoMin!=null&&(last.odoMin==null||s.odoMin<last.odoMin))last.odoMin=s.odoMin;
      if(s.odoMax!=null&&(last.odoMax==null||s.odoMax>last.odoMax))last.odoMax=s.odoMax;
    }else{trips.push({ids:[s.id],start:s.start,end:s.end,points:s.points,segs:1,odoMin:s.odoMin,odoMax:s.odoMax});}});
  if(!trips.length){if(!live)alert('데이터 없음');return;}
  trips.sort((a,b)=>b.end-a.end);
  trips.forEach(t=>t.key=t.ids[0]);
  const ym=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).slice(0,7);
  let mKm=0,mCnt=0,mCalls=0;
  trips.forEach(t=>{
    const d=new Date(t.start).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).slice(0,7);
    if(d===ym){mCnt++;mCalls+=(t.points||0);if(t.odoMin!=null&&t.odoMax!=null&&t.odoMax>=t.odoMin)mKm+=(t.odoMax-t.odoMin)*MI2KM;}
  });
  const _pct=mCalls/API_LIMIT;
  const _col=_pct>=0.9?'#d93025':(_pct>=0.7?'#e37400':'#34a853');
  monthStr='📅 이번 달 '+mKm.toFixed(0)+'km · '+mCnt+'회 · <span style="color:'+_col+'">📡 '+mCalls+'/'+API_LIMIT+'</span>';
  const df=document.getElementById('dfilter').value;
  let viewT=trips;
  if(df){viewT=trips.filter(t=>new Date(t.start).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})===df);}
  const list=document.getElementById('sellist');
  list.innerHTML='';
  if(!viewT.length){document.getElementById('selbtn').textContent='(그 날짜 주행 없음) ▾';setFront('<div style="color:#1a73e8;font-weight:bold">'+monthStr+'</div>');document.getElementById('cur').style.display='none';return;}
  let prevDay='';
  viewT.forEach(t=>{
    const day=new Date(t.start).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
    if(day!==prevDay){prevDay=day;const h=document.createElement('div');h.className='ddday';h.textContent=dayHeader(t.start);list.appendChild(h);}
    const it=document.createElement('div');it.className='dditem';it.textContent=rowLabel(t);
    it.onclick=()=>pickTrip(t.key);list.appendChild(it);
  });
  let pick=(keepSel&&curKey&&viewT.some(t=>t.key===curKey))?curKey:viewT[0].key;
  setSel(pick);selectTrip(pick);
}
async function selectTrip(key){
  curKey=key;
  const t=trips.find(x=>x.key===key);if(!t)return;
  const {data,error}=await sb.from('positions').select('*').in('drive_id',t.ids).order('ts',{ascending:true});
  if(error){if(!live)alert('경로 읽기 실패: '+error.message);return;}
  render(t,data||[]);
}
function render(t,a){
  if(layer)map.removeLayer(layer);
  layer=L.layerGroup().addTo(map);
  stopReplay();stopArrows();
  a=a.filter(p=>p.lat&&p.lng);
  curData=a;
  const pts=a.map(p=>[p.lat,p.lng]);
  if(!pts.length)return;
  for(let i=1;i<a.length;i++){
    const v=kmh(a[i].speed);
    L.polyline([pts[i-1],pts[i]],{color:speedColor(v),weight:5}).addTo(layer);
  }
  const host=L.polyline(pts,{opacity:0}).addTo(layer);
  if(L.polylineDecorator){
    arrowOffset=0;
    arrowDeco=L.polylineDecorator(host,{patterns:[{offset:0,repeat:85,symbol:arrowSym()}]}).addTo(layer);
    startArrows();
  }
  a.forEach(p=>{
    const tm=new Date(p.ts).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});
    const v=kmh(p.speed);
    const sh=p.shift_state?(' · '+p.shift_state):'';
    L.circleMarker([p.lat,p.lng],{radius:4,color:'#555',weight:1}).bindPopup(tm+(v!=null?'<br>'+v+'km/h':'')+sh).addTo(layer);
  });
  L.circleMarker(pts[0],{radius:9,color:'#1a7f37',fillColor:'#2ea043',fillOpacity:1}).bindPopup('🟢 출발').addTo(layer);
  L.circleMarker(pts[pts.length-1],{radius:9,color:'#7a0d11',fillColor:'#e82127',fillOpacity:1}).bindPopup('🔴 도착').addTo(layer);
  let km;
  const o0=a[0].odometer,oN=a[a.length-1].odometer;
  if(o0!=null&&oN!=null&&oN>=o0){km=(oN-o0)*MI2KM;}
  else{km=0;for(let i=1;i<a.length;i++)km+=dist(pts[i-1],pts[i]);}
  const min=Math.max(0,Math.round((new Date(a[a.length-1].ts)-new Date(a[0].ts))/60000));
  const avg=min>0?Math.round(km/(min/60)):0;
  let mx=0;a.forEach(p=>{const v=kmh(p.speed);if(v!=null&&v>mx)mx=v;});
  const last=a[a.length-1];
  const lv=kmh(last.speed);
  const lg=last.shift_state||'-';
  const curEl=document.getElementById('cur');
  curEl.style.display='block';
  curEl.innerHTML='<div class="u">'+(live?'🔴 현재':'🏁 마지막')+'</div><div class="v">'+(lv!=null?lv:0)+' <span class="u">km/h</span></div><div class="g" style="color:'+gearColor(lg)+'">'+lg+'</div>';
  const b0=a[0].battery,bN=a[a.length-1].battery;
  let line2='';
  if(b0!=null&&bN!=null){
    const used=b0-bN;
    line2='🔋 '+b0+'%→'+bN+'%';
    if(used>0){
      const kwh=used/100*KWH_TOTAL;
      const won=Math.round(kwh*WON_PER_KWH);
      const eff=(kwh>0&&km>0)?(km/kwh).toFixed(1):'-';
      line2+=' (−'+used+'%) · ⚡ '+won+'원 · '+eff+'km/kWh';
    }
  }
  let html='<div style="color:#1a73e8;font-weight:bold;margin-bottom:2px">'+monthStr+'</div>';
  html+='📏 '+km.toFixed(1)+'km · ⏱️ '+min+'분';
  html+='<br>🚗 평균 '+avg+(mx>0?(' · 🏁 최고 '+mx):'')+'km/h';
  if(line2)html+='<br>'+line2;
  html+='<div id="place" style="margin-top:4px;color:#1a73e8">📍 …</div>';
  html+='<div onclick="playRoute()" style="margin-top:5px;color:#1a73e8;font-size:12px;font-weight:bold">▶ 경로 재생</div>';
  setFront(html);
  Promise.all([placeName(pts[0][0],pts[0][1]),placeName(pts[pts.length-1][0],pts[pts.length-1][1])]).then(([s,e])=>{
    const pl=document.getElementById('place');if(pl)pl.textContent='📍 '+s+' → '+e;});
  if(!live)map.fitBounds(pts);
}
sb.auth.getSession().then(({data})=>{if(data.session)start();});
</script>
