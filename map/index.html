<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla 주행기록</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:sans-serif}
#map{height:100vh;width:100%}
#login{position:fixed;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000}
#login input{padding:12px;width:240px;border-radius:8px;border:none;font-size:16px}
#login button{padding:12px 24px;border-radius:8px;border:none;background:#e82127;color:#fff;font-size:16px}
#stats{position:fixed;top:10px;right:10px;z-index:900;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:13px;display:none;max-width:62%}
#bar{position:fixed;bottom:16px;left:10px;right:10px;z-index:900;display:none;gap:8px;align-items:center}
#bar select{flex:1;padding:10px;border-radius:8px;border:none;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#bar button{padding:10px 14px;border-radius:8px;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#msg{color:#f88;font-size:14px;min-height:18px}
</style>
</head>
<body>
<div id="login">
<h2>🚗 주행기록</h2>
<input id="email" type="email" placeholder="이메일">
<input id="pw" type="password" placeholder="비밀번호">
<button onclick="login()">로그인</button>
<div id="msg"></div>
</div>
<div id="stats"></div>
<div id="bar">
<select id="sel" onchange="render(this.value)"></select>
<button onclick="load()">↻</button>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://rzdjebtjlejjskvjrdec.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6ZGplYnRqbGVqanNrdmpyZGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTA0NDUsImV4cCI6MjA5Njk4NjQ0NX0.Gsd-dNi0nXVKXPu4Ch3etZrc0Kf-WDaJA6bjlKVxdo4";
// 이 분(分) 이내로 이어지는 주행은 하나로 합침. 합치는 정도 조절하려면 이 숫자만 바꾸세요.
const MERGE_GAP_MIN=2;
const sb=supabase.createClient(SB_URL,SB_KEY);
let map,layer,tripMap={},tripOrder=[];
async function login(){
  const email=document.getElementById('email').value;
  const pw=document.getElementById('pw').value;
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){document.getElementById('msg').innerText="로그인 실패: "+error.message;return;}
  start();
}
function start(){
  document.getElementById('login').style.display='none';
  document.getElementById('bar').style.display='flex';
  document.getElementById('stats').style.display='block';
  if(!map){map=L.map('map').setView([37.32,127.1],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM'}).addTo(map);}
  load();
}
function label(t){
  const w=new Date(t.start);
  const s=w.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const merged=t.segs>1?(' · '+t.segs+'구간'):'';
  return s+' · '+t.pts.length+'개'+merged;
}
function dist(a,b){
  const R=6371,r=x=>x*Math.PI/180;
  const dLat=r(b[0]-a[0]),dLng=r(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
async function load(){
  const {data,error}=await sb.from('positions').select('*').order('ts',{ascending:true});
  if(error){alert('읽기 실패: '+error.message);return;}
  const raw={};
  (data||[]).forEach(p=>{if(p.lat&&p.lng){(raw[p.drive_id]=raw[p.drive_id]||[]).push(p);}});
  let segs=Object.keys(raw).map(id=>{const pts=raw[id];return{id,pts,start:new Date(pts[0].ts).getTime(),end:new Date(pts[pts.length-1].ts).getTime()};});
  segs.sort((a,b)=>a.start-b.start);
  const GAP=MERGE_GAP_MIN*60000,trips=[];
  segs.forEach(s=>{
    const last=trips[trips.length-1];
    if(last&&(s.start-last.end)<=GAP){last.pts=last.pts.concat(s.pts);last.end=s.end;last.segs++;}
    else{trips.push({id:s.id,pts:s.pts.slice(),start:s.start,end:s.end,segs:1});}
  });
  if(!trips.length){alert('데이터 없음');return;}
  trips.sort((a,b)=>b.end-a.end);
  tripMap={};tripOrder=[];
  trips.forEach(t=>{tripMap[t.id]=t;tripOrder.push(t.id);});
  const sel=document.getElementById('sel');
  sel.innerHTML='';
  tripOrder.forEach(id=>{const o=document.createElement('option');o.value=id;o.text=label(tripMap[id]);sel.add(o);});
  sel.value=tripOrder[0];
  render(tripOrder[0]);
}
function render(id){
  const t=tripMap[id];if(!t)return;
  const a=t.pts;
  if(layer)map.removeLayer(layer);
  layer=L.layerGroup().addTo(map);
  const pts=a.map(p=>[p.lat,p.lng]);
  const poly=L.polyline(pts,{color:'#e82127',weight:4}).addTo(layer);
  if(L.polylineDecorator){
    L.polylineDecorator(poly,{patterns:[{offset:30,repeat:90,symbol:L.Symbol.arrowHead({pixelSize:12,polygon:true,pathOptions:{color:'#b3141a',fillOpacity:1,weight:0}})}]}).addTo(layer);
  }
  a.forEach(p=>{
    const tm=new Date(p.ts).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});
    L.circleMarker([p.lat,p.lng],{radius:4,color:'#e82127'}).bindPopup(tm+'<br>'+(p.speed||0)+'km/h').addTo(layer);
  });
  if(pts.length){
    L.circleMarker(pts[0],{radius:9,color:'#1a7f37',fillColor:'#2ea043',fillOpacity:1}).bindPopup('🟢 출발').addTo(layer);
    L.circleMarker(pts[pts.length-1],{radius:9,color:'#0a3069',fillColor:'#1f6feb',fillOpacity:1}).bindPopup('🔵 도착').addTo(layer);
  }
  let km=0;for(let i=1;i<a.length;i++)km+=dist(pts[i-1],pts[i]);
  const min=Math.max(0,Math.round((new Date(a[a.length-1].ts)-new Date(a[0].ts))/60000));
  const avg=min>0?Math.round(km/(min/60)):0;
  document.getElementById('stats').innerHTML='📏 '+km.toFixed(1)+'km · ⏱️ '+min+'분 · 🚗 평균 '+avg+'km/h';
  map.fitBounds(pts);
}
sb.auth.getSession().then(({data})=>{if(data.session)start();});
</script>
</body>
</html>
