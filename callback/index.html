<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인증 코드</title>
</head>
<body style="font-family:sans-serif;padding:24px;max-width:600px;margin:auto">
<h2>Tesla 인증 코드</h2>
<p>아래 코드를 복사해서 다음 단계에 쓰세요:</p>
<textarea id="code" readonly style="width:100%;height:140px;font-size:15px;padding:8px"></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('code').value);this.textContent='복사됨!'" style="font-size:16px;padding:10px 24px">복사</button></p>
<script>
var code = new URLSearchParams(location.search).get('code');
document.getElementById('code').value = code ? code : '코드가 없습니다. 주소창 전체를 확인하세요.';
</script>
</body>
</html>
